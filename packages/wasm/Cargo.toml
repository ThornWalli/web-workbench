[package]
name = "wasm"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/ThornWalli/web-workbench"
license = "MIT"


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "=0.10.2"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
wasm-bindgen = { version = "=0.2.127" }
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["WorkerGlobalScope", "console"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = "=0.27.0"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"


[dev-dependencies]
cargo-watch = "=8.5.3"


[features]
threads = ["wasm-bindgen/enable-interning"]
